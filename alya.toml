[package]
name = "web"
version = "0.2.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "High-level web framework for Alya: routing, middleware, JSON APIs, and views"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/web"
keywords = ["alya", "alya-lang", "package", "web", "framework", "router", "middleware", "rest", "mvc"]

[dependencies]
http = { git = "https://github.com/alya-lang/http", tag = "v0.4.0" }
json = { git = "https://github.com/alya-lang/json", tag = "v0.2.1" }
mustache = { git = "https://github.com/alya-lang/mustache", tag = "v0.1.0" }
pool = { git = "https://github.com/alya-lang/pool", tag = "v0.1.0" }

